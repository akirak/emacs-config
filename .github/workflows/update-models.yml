name: Update the AI model list

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '5 0 * * 5'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.CREATE_PR_APP_ID }}
          private-key: ${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update the models
        run: nix run .#update-ai-models

      - uses: peter-evans/create-pull-request@bd09a93810788ce61d2d5fb7d6b221b9b4a4aab7
        id: cpr
        with:
          base: develop
          token: ${{ steps.generate-token.outputs.token }}
          title: 'chore: Update the model list'
          branch: bot/update/ai-models
          labels: automation,update,emacs

      - name: Auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: |
          if gh pr merge "$PR_NUMBER" \
            --delete-branch --squash --auto; then
            echo "Auto-merge enabled for PR #$PR_NUMBER."
          else
            echo "Skipping auto-merge: it could not be enabled for PR #$PR_NUMBER."
          fi
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
